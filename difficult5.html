<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Difficult Question 5</title>
  <style>
    body {
      background: url('assets/images/parchment.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Verdana, Arial, sans-serif;
      color: #3b2f2f;
      text-align: center;
      padding: 40px;
      font-size: 18px;
      line-height: 1.6;
    }
    .quest-box {
      background: rgba(255,255,255,0.9);
      border: 3px solid #3b2f2f;
      border-radius: 12px;
      padding: 30px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    h1 { color: #5a3e2b; margin-bottom: 25px; font-size: 22px; }
    p { margin-bottom: 25px; font-size: 18px; }
    button {
      display: block;
      margin: 15px auto;
      padding: 14px 22px;
      background: #d4b483;
      color: #3b2f2f;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      max-width: 500px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #b9975b; color: #fff; }
    #feedback { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="quest-box">
    <h1>🔴 Difficult Question 5</h1>
    <p>What should you do during an earthquake while you are inside a building?</p>
    <form id="quizForm">
      <button type="button" data-choice="A">A. Shout for help and run randomly</button>
      <button type="button" data-choice="B">B. Run outside immediately even if objects are falling</button>
      <button type="button" data-choice="C">C. Drop, Cover, and Hold On until the shaking stops</button>
      <button type="button" data-choice="D">D. Record a video for social media</button>
    </form>
    <div id="feedback"></div>
  </div>

  <script>
    const feedback = document.getElementById("feedback");

    document.querySelectorAll("#quizForm button").forEach(btn => {
      btn.addEventListener("click", function() {
        const choice = this.getAttribute("data-choice");
        if (choice === "C") {
          feedback.textContent = "✅ Correct! Proceed to claim your reward...";
          feedback.style.color = "green";
          setTimeout(function() {
            window.location.href = "claim.html"; // ROUTE to claim reward page
          }, 2000);
        } else {
          feedback.textContent = "❌ Wrong answer. Try again!";
          feedback.style.color = "red";
        }
      });
    });
  </script>
</body>
</html>
