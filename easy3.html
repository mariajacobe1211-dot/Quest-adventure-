<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Easy General Questions – Q3</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="quiz">
    <h2>🟢 Easy General Questions</h2>
    <p>Q3. What is the largest organ in the human body?</p>
    <button onclick="checkAnswer('A')">A. Heart</button>
    <button onclick="checkAnswer('B')">B. Liver</button>
    <button onclick="checkAnswer('C')">C. Skin</button>
    <button onclick="checkAnswer('D')">D. Lungs</button>
    <div id="feedback"></div>
  </div>

  <script>
    function checkAnswer(choice) {
      const feedback = document.getElementById("feedback");
      if (choice === "C") {
        feedback.textContent = "✅ Correct! Transitioning to the Difficult Round...";
        feedback.style.color = "green";
        setTimeout(() => { window.location.href = "difficult1.html"; }, 2500);
      } else {
        feedback.textContent = "❌ Wrong answer. Try again!";
        feedback.style.color = "red";
      }
    }
  </script>
</body>
</html>
