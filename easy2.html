<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Easy Question 2</title></head>
<body style="margin:0;height:100vh;width:100vw;font-family:'Georgia',serif;
background:linear-gradient(to bottom right,#4e342e,#a1887f),
url('assets/css/parchment.jpg') no-repeat center center fixed;background-blend-mode:multiply;background-size:cover;
display:flex;justify-content:center;align-items:center;color:#2f1b0c;text-align:left;padding:40px;">
  <div id="quiz" style="font-size:1.8em;line-height:1.6;padding:40px;background:rgba(255,248,220,0.95);
  border:4px solid #8b5a2b;border-radius:14px;box-shadow:0 0 25px rgba(255,215,0,0.8);width:90%;max-width:1200px;font-weight:bold;">
    <h2 style="text-align:center;margin-bottom:25px;color:#5a3e1b;font-size:2.2em;">🟢 Easy General Question</h2>
    <p>Q2. Which civilization invented cuneiform, the earliest known writing system?</p>
    <button style="font-size:1.5em;" onclick="checkAnswer('A')">A. Egyptians — “Hieroglyphs lang sapat na!” 🐦</button>
    <button style="font-size:1.5em;" onclick="checkAnswer('B')">B. Greeks — “Alpha, Beta, Gamma… karaoke na!” 🎤</button>
    <button style="font-size:1.5em;" onclick="checkAnswer('C')">C. Sumerians — “OG writers, walang ballpen pero astig!”</button>
    <button style="font-size:1.5em;" onclick="checkAnswer('D')">D. Romans — “SPQR at chariot racing lang!” 🏛️</button>
    <div id="feedback" style="margin-top:20px;font-size:1.4em;"></div>
  </div>
  <script>
    function checkAnswer(choice){
      const feedback=document.getElementById("feedback");
      if(choice==="C"){
        feedback.textContent="✅ Correct! Proceeding to next question...";
        feedback.style.color="green";
        setTimeout(()=>{ window.location.href="easy3.html"; },2000);
      } else {
        feedback.textContent="❌ Wrong answer. Try again!";
        feedback.style.color="red";
      }
    }
  </script>
</body>
</html>
