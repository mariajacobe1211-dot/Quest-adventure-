<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balloon Finale</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: Verdana, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #message {
      font-size: 26px;
      text-align: center;
      max-width: 800px;
      opacity: 1;
      transition: opacity 2s ease;
      background: #ff3333;
      color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255,255,255,0.9);
      border: 3px solid #fff;
    }
    #message::before { content: "⚠️ 🤪 "; font-size: 32px; margin-right: 10px; }
    #balloons {
      display: none;
      opacity: 0;
      transition: opacity 2s ease;
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      justify-content: center;
      align-items: center;
      gap: 120px;
    }
    #balloons.show { display: flex; opacity: 1; }
    .balloon {
      width: 140px; height: 180px; border-radius: 50%;
      background: linear-gradient(135deg, #ff4d4d, #cc0000);
      cursor: pointer; position: relative;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
      transition: transform 0.3s;
    }
    .balloon:hover { transform: scale(1.1); }
    .balloon::after {
      content: ""; position: absolute; bottom: -50px; left: 50%;
      width: 2px; height: 50px; background: #fff;
    }
    #popup {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 40px; border-radius: 20px;
      color: #fff; font-size: 24px; text-align: center;
      display: none; max-width: 90%; max-height: 90%; overflow: auto;
    }
    #popup img { max-width: 220px; margin: 10px; border-radius: 10px; box-shadow: 0 0 10px #fff; }
    #closeBtn { margin-top: 20px; padding: 10px 20px; background: #d4b483; border: none; border-radius: 10px; font-size: 20px; cursor: pointer; }
    #finalMessage {
      display: none; position: fixed; bottom: 40px; width: 100%;
      text-align: center; font-size: 56px; font-weight: bold;
      color: #ffd700; text-shadow: 0 0 25px #fff, 0 0 40px #ff3333;
    }
    #restartBtn {
      display: none; position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      padding: 20px 50px; font-size: 28px; font-weight: bold;
      background: linear-gradient(135deg, #d4b483, #b9975b);
      color: #fff; border: none; border-radius: 20px; cursor: pointer;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }
    #restartBtn:hover { transform: scale(1.1); background: linear-gradient(135deg, #b9975b, #5a3e2b); }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <div id="message">Oops got ya! I do not have a tangible gift for you but consider this project and future adventure my gift for you.</div>

  <div id="balloons">
    <div class="balloon" id="balloon1"></div>
    <div class="balloon" id="balloon2"></div>
  </div>

  <div id="popup">
    <div id="popupContent"></div>
    <button id="closeBtn">Close</button>
  </div>

  <div id="finalMessage">🎉 Happy Birthday!</div>
  <button id="restartBtn">🔄 Restart Adventure</button>

  <canvas id="confetti"></canvas>

  <script>
    window.onload = function() {
      setTimeout(() => {
        const msg = document.getElementById("message");
        msg.style.opacity = 0;
        setTimeout(() => {
          msg.remove();
          const balloons = document.getElementById("balloons");
          balloons.classList.add("show");
          startConfetti();
        }, 2000);
      }, 4000);
    };

    document.getElementById("balloon1").addEventListener("click", () => {
      showPopup("<p>🎂 31 years old na nganiiii!</p>");
      showFinale();
    });
