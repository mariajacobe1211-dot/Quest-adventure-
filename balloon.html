<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balloon Surprise</title>
  <style>
    body {
      background: url('assets/images/balloons.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'MedievalSharp', cursive;
      color: #3b2f2f;
      text-align: center;
      animation: fadeIn 2s ease-in;
    }
    .balloon {
      font-size: 50px;
      cursor: pointer;
      margin: 20px;
      display: inline-block;
    }
    #surprise {
      display: none;
      margin-top: 30px;
    }
    #surprise img {
      width: 200px;
      border-radius: 10px;
      margin: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>🎈 Pop the Balloons! 🎈</h1>

  <!-- Balloons -->
  <div class="balloon" onclick="popBalloon(1)">🎈 Balloon 1</div>
  <div class="balloon" onclick="popBalloon(2)">🎈 Balloon 2</div>

  <!-- Surprise Section -->
  <div id="surprise">
    <img src="assets/images/photo1.jpg" alt="Surprise 1">
    <img src="assets/images/photo2.jpg" alt="Surprise 2">
    <img src="assets/images/photo3.jpg" alt="Surprise 3">
    <img src="assets/images/photo4.jpg" alt="Surprise 4">
    <h1 style="color:#ff4081;">🎉 Happy Birthday! 🎉</h1>
  </div>

  <script>
    function popBalloon(balloonNumber) {
      if (balloonNumber === 2) {
        document.getElementById('surprise').style.display = 'block';
      } else {
        alert("Balloon " + balloonNumber + " popped!");
      }
    }
  </script>
</body>
</html>
