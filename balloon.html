<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balloon Finale</title>
  <style>
    body {
      margin: 0; height: 100vh; background: #0d0d0d;
      color: #f0f0f0; font-family: Verdana, Arial, sans-serif;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }
    #message {
      font-size: 26px; text-align: center; max-width: 800px;
      opacity: 1; transition: opacity 2s ease;
      background: #ff3333; color: #fff; padding: 30px;
      border-radius: 12px; box-shadow: 0 0 25px rgba(255,255,255,0.9);
      border: 3px solid #fff;
    }
    #message::before { content: "⚠️ 🤪 "; font-size: 32px; margin-right: 10px; }

    #balloons {
      display: flex; opacity: 0; visibility: hidden;
      transition: opacity 2s ease;
      position: absolute; width: 100%; height: 100%;
      top: 0; left: 0; justify-content: center; align-items: center;
      gap: 120px;
    }
    #balloons.show { opacity: 1; visibility: visible; }

    .balloon {
      width: 140px; height: 180px; border-radius: 50%;
      background: linear-gradient(135deg, #ff4d4d, #cc0000);
      cursor: pointer; position: relative;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
      transition: transform 0.3s;
    }
    .balloon:hover { transform: scale(1.1); }
    .balloon::after {
      content: ""; position: absolute; bottom: -50px; left: 50%;
      width: 2px; height: 50px; background: #fff;
    }
    .balloon.pop { animation: pop 0.5s forwards; }
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

      background
