<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Quest Begins</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      margin: 0; height: 100vh;
      font-family: "Georgia", serif;
      background: url("assets/css/parchment.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
      color: #2f1b0c; text-align: center; padding: 40px;
    }
    #welcome {
      font-size: 1.6em; line-height: 1.8;
      padding: 40px; background: rgba(255,248,220,0.95);
      border: 4px solid #8b5a2b; border-radius: 14px;
      box-shadow: 0 0 18px #d2b48c; max-width: 900px;
      font-weight: bold;
    }
    h1 {
      margin-bottom: 20px; color: #5a3e1b;
      font-size: 2.2em; font-weight: bold;
    }
    p {
      margin-bottom: 25px;
    }
    button {
      padding: 16px 24px; font-size: 1.3em; font-weight: bold;
      background: #f5deb3; border: 3px solid #8b5a2b; border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #deb887; }
  </style>
</head>
<body>
  <div id="welcome">
    <h1>🎉 The Birthday Quest Awaits!</h1>
    <p>You’ve unlocked this challenge by scanning the QR.  
    Ready to test your knowledge and prove your wit?  
    PS: No need to review — stock knowledge will do!</p>
    <button onclick="startQuiz()">Begin the Challenge</button>
  </div>

  <script>
    function startQuiz() {
      // Start directly at Easy Question 1
      window.location.href = "easy1.html";
    }
  </script>
</body>
</html>
