<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Difficult Question 3</title></head>
<body style="margin:0;height:100vh;width:100vw;font-family:'Georgia',serif;background:linear-gradient(to bottom right,#4e342e,#a1887f),
url('assets/css/parchment.jpg') no-repeat center center fixed;background-blend-mode:multiply;background-size:cover;
display:flex;justify-content:center;align-items:center;color:#2f1b0c;text-align:left;padding:40px;">
  <div id="quiz" style="font-size:2em;line-height:1.8;padding:40px;background:rgba(255,248,220,0.95);
  border:4px solid #8b5a2b;border-radius:14px;box-shadow:0 0 25px rgba(255,215,0,0.8);width:90%;max-width:1200px;font-weight:bold;">
    <h2 style="text-align:center;margin-bottom:25px;color:#5a3e1b;font-size:2.2em;">🔴 Difficult Round</h2>
    <p>Q3. What is the maximum speed limit on a national highway (when conditions are safe and no lower speed limit is posted)?</p>
    <button onclick="checkAnswer('A')">A. 120 km/h — "Maluwag naman ang daan, kaya pa yan!" 😎</button>
    <button onclick="checkAnswer('B')">B. 80 km/h — "Safe na yan, hindi naman ako nagmamadali."</button>
    <button onclick="checkAnswer('C')">C. 100 km/h — "Hindi pa naman lumilipad ang kotse, sakto lang!" 😂</button>
    <button onclick="checkAnswer('D')">D. 150 km/h — "Testing lang kung gaano kalakas makina."</button>
    <div id="feedback"></div>
  </div>
  <script>
    function checkAnswer(choice){
      const feedback=document.getElementById("feedback");
      if(choice==="C"){
        feedback.textContent="✅ Correct! Proceeding to next question...";
        feedback.style.color="green";
        setTimeout(()=>{ window.location.href="difficult4.html"; },2000);
      } else {
        feedback.textContent="❌ Wrong answer. Try again!";
        feedback.style.color="red";
      }
    }
  </script>
</body>
</html>
