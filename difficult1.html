<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Difficult Quest - Page 1</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      background: url('assets/images/parchment.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'MedievalSharp', cursive;
      color: #3b2f2f;
      text-align: center;
      padding: 40px;
      font-size: 18px; /* readable but not oversized */
    }
    .quest-box {
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid #3b2f2f;
      border-radius: 12px;
      padding: 25px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    h1 {
      color: #5a3e2b;
      margin-bottom: 20px;
    }
    .choices a {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      background: #d4b483;
      color: #3b2f2f;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }
    .choices a:hover {
      background: #b9975b;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="quest-box">
    <h1>⚔️ Difficult Quest Begins ⚔️</h1>
    <p>You stand before the dark forest. The path is treacherous, and only the brave may proceed. Choose wisely…</p>

    <div class="choices">
      <a href="difficult2.html">Enter the forest</a>
      <a href="index.html">Retreat to safety</a>
    </div>
  </div>
</body>
</html>
