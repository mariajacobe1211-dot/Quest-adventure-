<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Difficult Practical Questions – Q4</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="message">
    <h2>🔴 Difficult Practical Questions</h2>

    <p><strong>Q4.</strong> A person suddenly faints. What should you do?</p>
    <ul>
      <li>A. Bigyan agad ng tubig kahit hindi pa gising</li>
      <li>B. Check their breathing and make sure they are safe</li>
      <li>C. Paupuin agad para hindi mahiga</li>
      <li>D. Sampalin ng konti para magising</li>
    </ul>
    <p class="answer">Answer: B</p>
  </div>

  <script>
    window.onload = function() {
      setTimeout(() => {
        const msg = document.getElementById("message");
        if (msg) msg.style.opacity = 0;
        setTimeout(() => {
          window.location.href = "difficult5.html";
        }, 2000);
      }, 8000);
    };
  </script>
</body>
</html>
