<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Difficult Question 4</title>
  <style>
    body {
      background: url('assets/images/parchment.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Verdana, Arial, sans-serif;
      color: #3b2f2f;
      text-align: center;
      padding: 40px;
      font-size: 18px;
      line-height: 1.6;
    }
    .quest-box {
      background: rgba(255,255,255,0.9);
      border: 3px solid #3b2f2f;
      border-radius: 12px;
      padding: 30px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    h1 { color: #5a3e2b; margin-bottom: 25px; font-size: 22px; }
    p { margin-bottom: 25px; font-size: 18px; }
    .choices button {
      display: block;
      margin: 15px auto;
      padding: 14px 22px;
      background: #d4b483;
      color: #3b2f2f;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      max-width: 500px;
      font-size: 18px;
      cursor: pointer;
    }
    .choices button:hover { background: #b9975b; color: #fff; }
    #feedback { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="quest-box">
    <h1>🔴 Difficult Question 4</h1>
    <p>A person suddenly faints. What should you do?</p>
    <div class="choices">
      <button onclick="checkAnswer('A')">A. Bigyan agad ng tubig kahit hindi pa gising</button>
      <button onclick="checkAnswer('B')">B. Check their breathing and make sure they are safe</button>
      <button onclick="checkAnswer('C')">C. Paupuin agad para hindi mahiga</button>
      <button onclick="checkAnswer('D')">D. Sampalin ng konti para magising</button>
    </div>
    <div id="feedback"></div>
  </div>

  <script>
    function checkAnswer(choice) {
      const feedback = document.getElementById('feedback');
      if (choice === 'B') {
        feedback.textContent = "✅ Correct! Proceeding to the final challenge...";
        feedback.style.color = "green";
        setTimeout(() => { window.location.href = 'difficult5.html'; }, 2000);
      } else {
        feedback.textContent = "❌ Wrong answer. Try again!";
        feedback.style.color = "red";
      }
    }
  </script>
</body>
</html>
