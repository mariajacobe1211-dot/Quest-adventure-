<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Easy Question 1</title>
  <style>
    body { margin:0; height:100vh; width:100vw; font-family:"Georgia",serif;
      background:linear-gradient(to bottom right,#4e342e,#a1887f),
      url("assets/css/parchment.jpg") no-repeat center center fixed;
      background-blend-mode:multiply; background-size:cover;
      display:flex; justify-content:center; align-items:center;
      color:#2f1b0c; text-align:left; padding:40px; }
    #quiz { font-size:2em; line-height:1.8; padding:40px;
      background:rgba(255,248,220,0.95); border:4px solid #8b5a2b;
      border-radius:14px; box-shadow:0 0 25px rgba(255,215,0,0.8);
      width:90%; max-width:1200px; font-weight:bold; }
    h2 { text-align:center; margin-bottom:25px; color:#5a3e1b; font-size:2.2em; }
    button { display:block; margin:16px 0; padding:20px; width:100%;
      font-weight:bold; font-size:1.4em;
      background:linear-gradient(to right,#f5deb3,#deb887);
      border:3px solid #8b5a2b; border-radius:10px; cursor:pointer;
      transition:transform 0.2s, background 0.3s; }
    button:hover { background:linear-gradient(to right,#deb887,#f5deb3); transform:scale(1.05); }
    #feedback { margin-top:25px; font-weight:bold; font-size:1.4em; }
  </style>
</head>
<body>
  <div id="quiz">
    <h2>🟢 Easy General Questions</h2>
    <p>Q1. What language do computers understand?</p>
    <button onclick="checkAnswer('A')">A. English</button>
    <button onclick="checkAnswer('B')">B. Binary</button>
    <button onclick="checkAnswer('C')">C. Python</button>
    <button onclick="checkAnswer('D')">D. Assembly</button>
    <div id="feedback"></div>
  </div>
  <script>
    function checkAnswer(choice){
      const feedback=document.getElementById("feedback");
      if(choice==="B"){
        feedback.textContent="✅ Correct! Proceeding to next question...";
        feedback.style.color="green";
        setTimeout(()=>{ window.location.href="easy2.html"; },2000);
      } else {
        feedback.textContent="❌ Wrong answer. Try again!";
        feedback.style.color="red";
      }
    }
  </script>
</body>
</html>
