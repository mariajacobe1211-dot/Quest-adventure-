<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Easy Question 1</title>
</head>
<body>
  <div id="quiz">
    <h2>🟢 Easy General Questions</h2>
    <p>Q1. What language do computers understand?</p>
    <button onclick="checkAnswer('A')">A. English</button>
    <button onclick="checkAnswer('B')">B. Binary</button>
    <button onclick="checkAnswer('C')">C. Python</button>
    <button onclick="checkAnswer('D')">D. Assembly</button>
    <div id="feedback"></div>
  </div>

  <script>
    function checkAnswer(choice) {
      const feedback = document.getElementById("feedback");
      if (choice === "B") {
        feedback.textContent = "✅ Correct! Proceeding to next question...";
        feedback.style.color = "green";
        setTimeout(() => { window.location.href = "easy2.html"; }, 2000);
      } else {
        feedback.textContent = "❌ Wrong answer. Try again!";
        feedback.style.color = "red";
      }
    }
  </script>
</body>
</html>
